<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>VayzTech — Links & Curated Tech</title>
  <meta name="description" content="Curated technology, minimal desk setups, and software workflows featured on TikTok." />
  <meta name="theme-color" content="#FFFFFF" id="meta-theme-color" />

  <!-- Modern Apple-like Typography: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- Subtle Top Navigation Bar -->
  <header class="top-bar">
    <div class="top-bar-inner">
      <div class="brand-pill" id="status-indicator">
        <span class="status-dot" id="db-dot"></span>
        <span class="brand-mono" id="top-handle">@vayztech</span>
      </div>

      <div class="top-actions">
        <button type="button" class="icon-btn" id="share-btn" aria-label="Copy page link" title="Copy page URL">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
            <polyline points="16 6 12 2 8 6"></polyline>
            <line x1="12" y1="2" x2="12" y2="15"></line>
          </svg>
        </button>

        <button type="button" class="icon-btn" id="theme-toggle" aria-label="Toggle color theme" title="Switch Light / Dark mode">
          <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="container">
    <!-- Hero / Profile Section -->
    <section class="profile-header" aria-label="Profile">
      <div class="avatar-wrapper" id="avatar-wrapper">
        <img id="profile-avatar" src="" alt="Profile Avatar" class="avatar-img hidden" />
        <div id="avatar-fallback" class="avatar-fallback">
          <span id="avatar-initials">VT</span>
        </div>
      </div>

      <div class="profile-meta">
        <div class="title-row">
          <h1 id="profile-title" class="profile-title">VayzTech</h1>
          <span class="verified-mark" title="Verified Creator" aria-label="Verified">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1.41 14.59L6.7 12.7a.996.996 0 1 1 1.41-1.41l2.48 2.48 5.3-5.3a.996.996 0 1 1 1.41 1.41l-6.71 6.71z"/>
            </svg>
          </span>
        </div>
        <p id="profile-handle" class="profile-handle">@vayztech</p>
        <p id="profile-bio" class="profile-bio">
          Next-gen consumer tech, desk architecture &amp; software workflows. Featured on TikTok.
        </p>
      </div>

      <!-- Primary Action Buttons: TikTok & Email -->
      <div class="social-bar" role="group" aria-label="Social and Contact Links">
        <a id="social-tiktok" href="https://www.tiktok.com/@vayztech" target="_blank" rel="noopener noreferrer" class="social-pill social-pill-primary">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
            <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/>
          </svg>
          <span>Follow on TikTok</span>
        </a>

        <a id="social-email" href="mailto:hello@vayztech.com" class="social-pill social-pill-secondary">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="4" width="20" height="16" rx="3"></rect>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
          </svg>
          <span>Email Inquiry</span>
        </a>
      </div>
    </section>

    <!-- Category Bar (Supports Filter Categories & Highlighted Clickable Link Categories) -->
    <nav class="category-filter-wrap" id="category-nav-wrap" aria-label="Categories">
      <div class="category-segmented" id="category-segmented">
        <!-- Populated dynamically by app.js -->
      </div>
    </nav>

    <!-- Links List -->
    <section class="links-section" aria-label="Curated Links">
      <div id="links-list" class="links-list">
        <!-- Populated dynamically by app.js -->
      </div>
    </section>

    <!-- Minimal Footer -->
    <footer class="site-footer">
      <div class="footer-icons">
        <a id="footer-tiktok" href="https://www.tiktok.com/@vayztech" target="_blank" rel="noopener noreferrer" class="footer-icon-link" aria-label="TikTok">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/>
          </svg>
        </a>
        <a id="footer-email" href="mailto:hello@vayztech.com" class="footer-icon-link" aria-label="Email">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="3"></rect>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
          </svg>
        </a>
      </div>
      <p class="footer-copy">
        Copyright &copy; <span id="footer-year">2026</span> vayz.tech
      </p>
    </footer>
  </main>

  <!-- Toast Notification -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="/app.js" defer></script>
</body>
</html>
